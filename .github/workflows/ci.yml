name: CI

# 服务端是唯一硬门禁：本地 hook 只负责早发现。
# 合并前需要的 required check：verify（含前端构建）。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  TEST_DB_NAME: customer_service_test
  TEST_DB_USER: postgres
  TEST_DB_PASSWORD: postgres
  TEST_DB_HOST: 127.0.0.1

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # review_pack 测试按提交 subject 识别固定点，需要完整历史。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装依赖（锁定版本）
        run: |
          uv sync --frozen
          pnpm -C apps/chat install --frozen-lockfile
          pnpm -C apps/workspace install --frozen-lockfile
          pnpm -C packages/contracts install --frozen-lockfile
      - name: 全量验证（不写回状态文件）
        run: ./scripts/verify.sh --no-record

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # mutmut 的 clean tests 在副本目录启动应用，必须连已迁移的测试库。
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/customer_service_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖（锁定版本）
        run: uv sync --frozen
      - name: 准备测试库
        run: TEST_DB_NAME=customer_service_test ./scripts/test-db.sh tests/unit -q
      - name: 关键模块突变（Workflow/Gateway ≥80%，Policy/领域 ≥70%）
        run: ./scripts/mutation.sh

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 审计 Python 依赖（含传递依赖）
        run: |
          uv export --frozen --no-dev --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 审计前端依赖
        # high/critical 必须为 0。唯一豁免是 picomatch ReDoS（CVE-2026-112366）：
        # 上游暂无修复版本，且只出现在 eslint 工具链（dev 依赖），
        # 豁免写在 apps/*/package.json 的 pnpm.auditConfig.ignoreCves。
        run: |
          pnpm -C apps/chat audit --audit-level high
          pnpm -C apps/workspace audit --audit-level high
