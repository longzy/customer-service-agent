[project]
name = "customer-service-agent"
version = "0.1.0"
description = "电商智能客服 Agent 参考实现"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.26.0",
    "rfc3339-validator>=0.1.4",
    "httpx2>=2.16.0",
    "types-jsonschema>=4.26.0.20261006",
    "mutmut>=3.8.1",
    "shellcheck-py>=0.11.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "BLE", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# 测试用 assert 表达断言，不适用 bandit 的生产代码规则
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 依赖库的弃用警告升级为错误，避免带着弃用继续开发；无关的第三方警告不拦截
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.mutmut]
# 只对确定性核心跑突变：范围与 docs/process/tdd.md 第 5 节一致
source_paths = ["backend/tools", "backend/workflows", "backend/domain"]
also_copy = [
    "tests",
    "packages",
    "migrations",
    "scripts",
    "docs",
    "backend",
    "evals",
    "Makefile",
    ".githooks",
    "apps/chat/app",
    "apps/chat/components",
    "apps/chat/features",
    "apps/chat/lib",
    "apps/workspace/app",
    "apps/workspace/components",
    "apps/workspace/features",
    "apps/workspace/lib",
]
pytest_add_cli_args_test_selection = ["tests/unit"]
