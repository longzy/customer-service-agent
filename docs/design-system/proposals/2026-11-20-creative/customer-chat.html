<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>客户聊天 · A</title>
<style>
  :root{
    --bg:#f7f8fa; --surface:#fff; --surface-2:#f2f4f5;
    --border:#e5e8eb; --line-soft:#eef0f2;
    --text:#101828; --text-2:#475467; --text-3:#667085;
    --accent:#111827; --accent-soft:#f3f4f6;
    --online:#12b76a;
    --warning-soft:#fffaeb; --warning-line:#fedf89; --warning-ink:#93370d;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#e9ebee;font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;min-height:1500px}
  .screen{width:1200px;height:800px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}

  /* 顶栏 64：品牌 + 状态 + 客户身份，不放导航 */
  header{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;
         background:var(--surface);border-bottom:1px solid var(--border)}
  .mk{width:36px;height:36px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
  .nm{font-size:14px;font-weight:600;line-height:1.2}
  .sub{font-size:10.5px;letter-spacing:.14em;color:var(--text-3);margin-top:3px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;
        border:1px solid #e2e5e9;background:var(--accent-soft);font-size:12px;font-weight:500;color:var(--text)}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--online);box-shadow:0 0 0 3px rgba(18,183,106,.14)}
  .right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .who{font-size:13px;color:var(--text-2);margin-right:6px}
  .ghost{height:30px;padding:0 12px;border-radius:8px;border:0;background:transparent;
         font-family:var(--font);font-size:13px;color:var(--text-2)}
  .outline{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--border);
           background:var(--surface);font-family:var(--font);font-size:13px;color:var(--text)}

  /* 消息列 860 居中，左右 24 */
  .col{width:100%;max-width:860px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;
       min-height:0;flex:1}
  .thread{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:20px;padding:24px 0 8px}

  /* 欢迎卡：只在第一次进入出现，声波在这里露出一次 */
  .welcome{position:relative;overflow:hidden;max-width:560px;border:1px solid var(--border);
           border-radius:18px;background:var(--surface);padding:20px 22px;
           box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .welcome h2{position:relative;z-index:2;margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
  .welcome p{position:relative;z-index:2;margin:6px 0 0;font-size:13.5px;line-height:1.7;color:var(--text-2);max-width:420px}
  .welcome svg{position:absolute;right:-86px;bottom:-118px;width:200px;height:200px;opacity:.22}
  .quick{display:flex;gap:8px;margin-top:14px;position:relative;z-index:2}
  .quick button{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--border);
                background:var(--surface);font-family:var(--font);font-size:12.5px;color:var(--text-2);
                display:inline-flex;align-items:center;gap:6px}

  /* 气泡：客户黑底右、AI 白底左，靠方向与明暗区分，不靠色相 */
  .msg{display:flex;gap:10px;max-width:620px}
  .msg.out{align-self:flex-end;justify-content:flex-end}
  .av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;
      display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;margin-top:2px}
  .bubble{max-width:520px;border-radius:18px;padding:12px 16px;font-size:14px;line-height:1.7;white-space:pre-wrap}
  .in .bubble{background:var(--surface);border:1px solid var(--border);color:var(--text);border-top-left-radius:6px}
  .out .bubble{background:var(--accent);color:#fff;border-top-right-radius:6px}
  .time{font-size:11px;color:var(--text-3);margin-top:6px;font-variant-numeric:tabular-nums}
  .in .time{margin-left:2px}
  .out .time{text-align:right;margin-right:2px}
  .sys{align-self:center;border-radius:999px;background:var(--surface-2);padding:5px 12px;
       font-size:12px;color:var(--text-3)}

  /* 等待卡：客户侧只说「正在接通」，不露 5 分钟阈值与队列位次（内部概念） */
  .wait{display:flex;gap:12px;max-width:560px;border:1px solid var(--warning-line);
        background:var(--warning-soft);border-radius:14px;padding:14px 16px}
  .wait .pulse{width:8px;height:8px;border-radius:50%;background:#f79009;margin-top:7px;flex:none;
               box-shadow:0 0 0 4px rgba(181,71,8,.14)}
  .wait b{display:block;font-size:13.5px;color:var(--warning-ink);font-weight:600}
  .wait span{display:block;font-size:12.5px;line-height:1.7;color:var(--warning-ink);margin-top:4px}

  /* 输入区：一张卡，不堆控件 */
  .composer{flex:none;padding:12px 0 22px}
  .box{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:12px 14px;
       box-shadow:0 8px 24px -14px rgba(16,24,40,.18)}
  .box .ph{font-size:14px;color:var(--text-3);padding:2px 2px 0}
  .box .bar{display:flex;align-items:center;gap:10px;margin-top:14px}
  .kbd{border:1px solid var(--border);border-radius:5px;background:var(--surface-2);padding:1px 5px;
       font-size:10.5px;color:var(--text-3)}
  .hintline{font-size:11.5px;color:var(--text-3)}
  .count{margin-left:auto;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .send{width:34px;height:34px;border-radius:9px;border:0;background:var(--accent);color:#fff;
        display:grid;place-items:center;flex:none}
  .footnote{margin:10px 0 0;text-align:center;font-size:11.5px;color:var(--text-3)}
</style>
</head>
<body>
<div class="screen">
  <header>
    <span class="mk">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <path d="M4 6.5a7 7 0 0 1 12 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M6.2 9.5a4.6 4.6 0 0 1 7.6 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="10" cy="12.6" r="1.5" fill="#fff"/>
      </svg>
    </span>
    <span>
      <span class="nm" style="display:block">回声客服</span>
      <span class="sub" style="display:block">ECHO CARE</span>
    </span>
    <span class="chip"><span class="dot"></span>AI 服务中</span>

    <div class="right">
      <span class="who">林知夏</span>
      <button class="ghost">结束会话</button>
      <button class="outline">退出</button>
    </div>
  </header>

  <div class="col">
    <div class="thread">

      <section class="welcome">
        <svg viewBox="0 0 500 500" fill="none" aria-hidden="true">
          <g stroke="#101828">
            <path d="M120 440A320 320 0 0 1 440 120" stroke-width="1.1" opacity=".10"/>
            <path d="M180 440A260 260 0 0 1 440 180" stroke-width="1.1" opacity=".13" stroke-dasharray="3 8"/>
            <path d="M240 440A200 200 0 0 1 440 240" stroke-width="1.2" opacity=".17"/>
            <path d="M305 440A135 135 0 0 1 440 305" stroke-width="1.3" opacity=".23"/>
            <path d="M365 440A75 75 0 0 1 440 365" stroke-width="1.4" opacity=".32"/>
          </g>
        </svg>
        <h2>你好，我是小回。</h2>
        <p>我可以帮你查订单、改配送、办理退换。需要真人时，直接说「转人工」。</p>
        <div class="quick">
          <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>查订单</button>
          <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>改地址</button>
          <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12Z"/></svg>转人工</button>
        </div>
      </section>

      <article class="msg out">
        <div>
          <div class="bubble">我想退掉上周买的那件外套</div>
          <div class="time">16:42</div>
        </div>
      </article>

      <article class="msg in">
        <span class="av">回</span>
        <div>
          <div class="bubble">找到订单 #A-2026-1187，11 月 12 日签收，还在 7 天无理由期内。需要我直接发起退货吗？</div>
          <div class="time">16:42</div>
        </div>
      </article>

      <article class="msg out">
        <div>
          <div class="bubble">要，但运费谁承担？想先确认一下</div>
          <div class="time">16:43</div>
        </div>
      </article>

      <p class="sys">已为你转接真人客服</p>

      <div class="wait">
        <span class="pulse" aria-hidden="true"></span>
        <div>
          <b>正在为你接通人工客服</b>
          <span>接通后会在这里提示你，也可以先补充问题。</span>
        </div>
      </div>

    </div>

    <div class="composer">
      <div class="box">
        <div class="ph">补充你想问的问题…</div>
        <div class="bar">
          <span class="hintline"><span class="kbd">Enter</span> 发送 · <span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</span>
          <span class="count">0/2000</span>
          <button class="send" aria-label="发送">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <p class="footnote">对话由真人客服与 AI 助手共同提供 · 请勿发送支付密码等敏感信息</p>
    </div>
  </div>
</div>
</body>
</html>
