<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>ECHO CONSOLE · 坐席登录（设计提案）</title>
<style>
  :root {
    --ink: #1b1b17;
    --muted: #57554e;
    --faint: #726f65;
    --line: #e6e2d8;
    --line-soft: #efece4;
    --paper: #ffffff;
    --canvas: #f6f5f1;
    --deep: #13211c;
    --brand: #0f5c4c;
    --brand-soft: #eaf2ee;
    --amber: #94550a;
    --danger: #b4441c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; width: 1440px; height: 960px; }

  /* 左品牌区 */
  .brand {
    width: 520px;
    flex: none;
    background: var(--deep);
    color: #f0ede4;
    padding: 40px 48px 34px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .art { position: absolute; right: -140px; top: 40px; width: 420px; height: 420px; pointer-events: none; }
  .brand > *:not(.art) { position: relative; }

  .logo { display: flex; align-items: center; gap: 11px; }
  .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; }
  .logo-name { font-size: 13.5px; font-weight: 600; letter-spacing: 0.14em; }
  .logo-sub { margin-top: 2px; font-size: 9.5px; letter-spacing: 0.2em; color: rgba(240, 237, 228, 0.42); }

  .headline {
    margin: 120px 0 0;
    font-size: 40px;
    line-height: 1.22;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .headline span { color: #9ec7b8; }

  .lede { margin: 20px 0 0; font-size: 13px; line-height: 1.9; color: rgba(240, 237, 228, 0.6); max-width: 340px; }

  .facts { margin-top: 36px; display: flex; gap: 32px; }
  .fact .k { font-size: 22px; font-weight: 600; color: #eaf3ee; font-variant-numeric: tabular-nums; }
  .fact .l { margin-top: 4px; font-size: 10.5px; color: rgba(240, 237, 228, 0.42); letter-spacing: 0.04em; }

  .brand-foot { margin-top: auto; display: flex; align-items: flex-end; }
  .brand-foot .meta { font-size: 10.5px; line-height: 1.9; color: rgba(240, 237, 228, 0.38); }
  .brand-foot .meta b { color: rgba(240, 237, 228, 0.6); font-weight: 500; }
  .env {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 9px;
    border-radius: 999px;
    border: 1px solid rgba(240, 237, 228, 0.18);
    color: rgba(240, 237, 228, 0.62);
    font-size: 9.5px;
    letter-spacing: 0.1em;
  }
  .env .d { width: 6px; height: 6px; border-radius: 50%; background: #d8a54a; }

  /* 右表单区 */
  .pane {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--canvas);
  }

  .help-link { position: absolute; top: 32px; right: 40px; font-size: 11.5px; color: var(--muted); }

  .card {
    width: 400px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 34px 28px;
    box-shadow: 0 1px 2px rgba(19, 33, 28, 0.04), 0 24px 48px -36px rgba(19, 33, 28, 0.22);
  }

  .card-head { display: flex; align-items: center; }
  .kicker { font-size: 10px; letter-spacing: 0.18em; color: var(--faint); font-weight: 600; }
  .badge-env {
    margin-left: auto;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: #8a6a34;
    background: #faf6ec;
    border: 1px solid #ece2cc;
    border-radius: 999px;
    padding: 2px 7px;
  }

  .card h1 { margin: 10px 0 0; font-size: 23px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { margin: 7px 0 0; font-size: 12px; color: var(--muted); line-height: 1.7; }

  .form { margin-top: 24px; display: flex; flex-direction: column; gap: 15px; }
  .field label { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); margin-bottom: 7px; }
  .input {
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #fff;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
  }
  .input input {
    border: 0; outline: 0; width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: transparent;
  }
  .input input::placeholder { color: var(--faint); }
  .input.focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 92, 76, 0.12); }
  .eye { color: var(--faint); display: grid; place-items: center; flex: none; }

  .keep { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .cb {
    appearance: none;
    width: 15px; height: 15px;
    border: 1.5px solid #cfcabc;
    border-radius: 4px;
    background: #fff;
    margin: 0;
    position: relative;
    flex: none;
  }
  .cb:checked { background: var(--brand); border-color: var(--brand); }
  .cb:checked::after {
    content: "";
    position: absolute;
    left: 4px; top: 1px;
    width: 4px; height: 8px;
    border: solid #fff;
    border-width: 0 1.6px 1.6px 0;
    transform: rotate(45deg);
  }

  .submit {
    height: 42px;
    border: 0;
    border-radius: 9px;
    background: var(--brand);
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    margin-top: 4px;
  }

  .audit {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line-soft);
    font-size: 10.5px;
    line-height: 1.8;
    color: var(--faint);
    display: flex;
    gap: 7px;
  }
  .audit svg { flex: none; margin-top: 2px; color: var(--faint); }

  .last {
    margin-top: 14px;
    text-align: center;
    font-size: 10.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="brand">
      <svg class="art" viewBox="0 0 420 420" fill="none" aria-hidden="true">
        <circle cx="390" cy="30" r="130" stroke="rgba(158,199,184,0.12)" stroke-width="1"/>
        <circle cx="390" cy="30" r="200" stroke="rgba(158,199,184,0.08)" stroke-width="1"/>
        <circle cx="390" cy="30" r="270" stroke="rgba(158,199,184,0.05)" stroke-width="1"/>
      </svg>

      <div class="logo">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 6.5a7 7 0 0 1 12 0" stroke="#eaf4ef" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M6.2 9.5a4.6 4.6 0 0 1 7.6 0" stroke="#9ec7b8" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="10" cy="12.6" r="1.5" fill="#eaf4ef"/>
          </svg>
        </div>
        <div>
          <div class="logo-name">ECHO</div>
          <div class="logo-sub">CONSOLE</div>
        </div>
      </div>

      <h1 class="headline">客服工作台<br /><span>登录后开始接待。</span></h1>
      <p class="lede">待接入队列、会话详情与完整交接记录。登录后你可以看到本租户的客户会话，所有操作都会被审计。</p>

      <div class="facts">
        <div class="fact"><div class="k">12</div><div class="l">当前等待</div></div>
        <div class="fact"><div class="k">40s</div><div class="l">平均响应</div></div>
        <div class="fact"><div class="k">8h</div><div class="l">会话锁定</div></div>
      </div>

      <div class="brand-foot">
        <div class="meta">
          <b>内部系统 · 仅限员工使用</b><br />
          ECHO CONSOLE v0.1.0
        </div>
        <span class="env"><span class="d"></span>开发环境</span>
      </div>
    </aside>

    <section class="pane">
      <span class="help-link">登录遇到问题？</span>

      <div class="card">
        <div class="card-head">
          <span class="kicker">AGENT SIGN IN</span>
          <span class="badge-env">DEV</span>
        </div>
        <h1>登录工作台</h1>
        <p class="sub">使用员工账号登录，进入待接入队列。</p>

        <div class="form">
          <div class="field">
            <label for="staff">工号或邮箱</label>
            <div class="input">
              <input id="staff" type="text" value="chen.mo" />
            </div>
          </div>

          <div class="field">
            <label for="password">密码</label>
            <div class="input focus">
              <input id="password" type="text" value="············" style="letter-spacing: 2px;" />
              <span class="eye">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M1.8 8S4 3.8 8 3.8 14.2 8 14.2 8 12 12.2 8 12.2 1.8 8 1.8 8Z" stroke="currentColor" stroke-width="1.3"/>
                  <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
                </svg>
              </span>
            </div>
          </div>

          <label class="keep">
            <input class="cb" type="checkbox" checked />
            在此设备保持登录 8 小时
          </label>

          <button class="submit" type="button">登录</button>
        </div>

        <div class="audit">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1.8 13 3.6v4.1c0 3-2.1 5.4-5 6.5-2.9-1.1-5-3.5-5-6.5V3.6L8 1.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          </svg>
          <span>仅限内部员工。登录、领取与关闭会话均记录在审计日志中，用于安全追溯。</span>
        </div>

        <div class="last">上次登录：11-17 18:20 · 上海</div>
      </div>
    </section>
  </div>
</body>
</html>
